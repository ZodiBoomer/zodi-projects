<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZodiBot</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Unbounded:wght@500;700&display=swap");
      :root {
        color-scheme: dark;
        --bg: #0b1017;
        --bg-2: #121a24;
        --surface: #162131;
        --surface-2: #131d2a;
        --stroke: rgba(255, 255, 255, 0.12);
        --text: #f4f7fb;
        --muted: #c3cbd8;
        --accent: #ff9f45;
        --accent-2: #37c6ff;
        --accent-3: #9b6bff;
        --success: #2cb67d;
        --danger: #f05454;
        --chip: rgba(255, 159, 69, 0.22);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 800px at 10% -20%, rgba(55, 198, 255, 0.28), transparent 60%),
          radial-gradient(900px 700px at 90% -10%, rgba(255, 159, 69, 0.32), transparent 65%),
          radial-gradient(900px 600px at 70% 120%, rgba(155, 107, 255, 0.25), transparent 60%),
          linear-gradient(155deg, var(--bg), var(--bg-2) 50%, #17202b 100%);
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
        overflow: hidden;
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      body::before {
        background-image:
          linear-gradient(transparent 0 94%, rgba(255,255,255,0.03) 94% 100%),
          linear-gradient(90deg, transparent 0 94%, rgba(255,255,255,0.03) 94% 100%);
        background-size: 32px 32px, 32px 32px;
        opacity: 0.28;
      }
      body::after {
        background:
          radial-gradient(400px 280px at 15% 20%, rgba(255, 159, 69, 0.3), transparent 70%),
          radial-gradient(520px 360px at 85% 35%, rgba(55, 198, 255, 0.26), transparent 70%),
          radial-gradient(420px 360px at 70% 85%, rgba(155, 107, 255, 0.24), transparent 70%);
        filter: blur(10px);
        opacity: 0.7;
      }
      .card {
        width: 100vw;
        height: 100vh;
        background:
          linear-gradient(180deg, rgba(24, 34, 50, 0.92), rgba(16, 22, 32, 0.94)),
          radial-gradient(700px 300px at 10% 0%, rgba(255, 159, 69, 0.12), transparent 70%);
        border: 1px solid var(--stroke);
        border-radius: 0;
        padding: 24px 22px 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;
        animation: cardIn 420ms ease-out;
        backdrop-filter: blur(10px);
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        pointer-events: none;
      }
      h1 {
        margin: 0 0 6px;
        font-family: "Unbounded", "Space Grotesk", sans-serif;
        font-size: 26px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        text-shadow: 0 8px 18px rgba(255, 159, 69, 0.25);
      }
      p {
        margin: 8px 0;
        line-height: 1.55;
        color: var(--muted);
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--chip);
        color: #ffd3a8;
        font-size: 12px;
        letter-spacing: 0.4px;
      }
      .note {
        margin-top: 10px;
        font-size: 12px;
        color: #93a0b3;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .input {
        flex: 1 1 220px;
        min-width: 200px;
        background: var(--surface-2);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
        padding: 9px 12px;
        border-radius: 10px;
      }
      .btn {
        background: rgba(255, 255, 255, 0.34);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13.5px;
        letter-spacing: 0.2px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22), inset 0 0 0 1px rgba(255,255,255,0.04);
        transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn:active { transform: translateY(0); }
      .btn.secondary {
        background: rgba(255, 255, 255, 0.3);
        color: #ffffff;
        border-color: rgba(255,255,255,0.22);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
      }
      .btn.danger {
        background: rgba(255, 120, 120, 0.52);
        color: #ffffff;
        border-color: rgba(255, 120, 120, 0.45);
      }
      #bindBtn {
        background: rgba(255, 170, 90, 0.6);
        color: #ffffff;
        border-color: rgba(255, 178, 102, 0.7);
        box-shadow: 0 10px 22px rgba(255, 158, 69, 0.24);
      }
      .menu {
        margin-top: 6px;
        padding: 14px 12px 10px;
        border-top: 1px solid var(--stroke);
        overflow: auto;
        flex: 1 1 auto;
        min-height: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 50%);
        border-radius: 16px;
      }
      .embed-title {
        font-size: 18px;
        margin-bottom: 6px;
        color: #f4f7fb;
      }
      .embed-desc {
        color: var(--muted);
        white-space: pre-line;
      }
      .fields {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }
      .field {
        background: rgba(255,255,255,0.06);
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
      }
      .field .name { font-weight: 600; margin-bottom: 4px; color: #f1f4f8; }
      .rows {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .row .btn {
        background: rgba(255, 255, 255, 0.34);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        font-weight: 500;
      }
      .row .btn.primary {
        background: rgba(76, 194, 255, 0.6);
        color: #ffffff;
        border-color: rgba(76, 194, 255, 0.6);
        box-shadow: inset 0 0 0 1px rgba(76, 194, 255, 0.25);
      }
      .row .btn.success {
        background: rgba(54, 201, 138, 0.6);
        color: #ffffff;
        border-color: rgba(54, 201, 138, 0.55);
        box-shadow: inset 0 0 0 1px rgba(54, 201, 138, 0.22);
      }
      .row .btn.danger {
        background: rgba(255, 120, 120, 0.6);
        color: #ffffff;
        border-color: rgba(255, 120, 120, 0.6);
        box-shadow: inset 0 0 0 1px rgba(255, 120, 120, 0.24);
      }
      .row .btn.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }
      .panes {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 16px;
        flex: 1 1 auto;
        min-height: 0;
      }
      .pane {
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding-right: 6px;
        min-height: 0;
      }
      .log-entry {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: rgba(12, 16, 22, 0.8);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.25);
        animation: fadeUp 220ms ease-out;
      }
      .log-meta {
        font-size: 12px;
        color: #9aa7b6;
        margin-bottom: 6px;
      }
      .log-text {
        white-space: pre-line;
        color: #d6dde6;
        margin-bottom: 8px;
      }
      .log-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .log-actions .row {
        gap: 6px;
      }
      @keyframes cardIn {
        from { transform: translateY(8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes fadeUp {
        from { transform: translateY(6px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @media (max-width: 980px) {
        .panes { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ZodiBot est lancé</h1>
      
      <div id="status" class="note"></div>
      <div id="bind" class="controls">
        <button id="bindBtn" class="btn">Activer (local)</button>
        <button id="serverBtn" class="btn secondary">Choisir un serveur</button>
        <button id="channelBtn" class="btn secondary">Choisir un salon</button>
        <button id="refreshBtn" class="btn secondary">Rafraîchir</button>
        <button id="clearLogsBtn" class="btn secondary">Vider l'historique</button>
      </div>
      <div class="panes">
        <div class="pane">
          <div id="menu" class="menu" style="display:none;">
            <div class="embed-title" id="embedTitle"></div>
            <div class="embed-desc" id="embedDesc"></div>
            <div class="fields" id="embedFields"></div>
            <div class="rows" id="embedRows"></div>
          </div>
          <div id="modal" class="menu" style="display:none;">
            <div class="embed-title" id="modalTitle"></div>
            <div id="modalFields" class="fields"></div>
            <div class="controls">
              <button id="modalSubmit" class="btn">Valider</button>
              <button id="modalCancel" class="btn secondary">Annuler</button>
            </div>
          </div>
        </div>
        <div class="pane">
          <div id="logPanel" class="menu" style="display:none;">
            <div class="embed-title">Historique des réponses</div>
            <div id="logList" class="embed-desc"></div>
          </div>
        </div>
      </div>
      <div class="tag">Electron UI</div>
      <p class="note">Fermer cette fenêtre arrête aussi le bot.</p>
    </div>
        <script>
      const API = "http://localhost:3000";
      const statusEl = document.getElementById("status");
      const menuEl = document.getElementById("menu");
      const bindBtn = document.getElementById("bindBtn");
      const serverBtn = document.getElementById("serverBtn");
      const channelBtn = document.getElementById("channelBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const embedTitle = document.getElementById("embedTitle");
      const embedDesc = document.getElementById("embedDesc");
      const embedFields = document.getElementById("embedFields");
      const embedRows = document.getElementById("embedRows");
      const logPanel = document.getElementById("logPanel");
      const logList = document.getElementById("logList");
      const clearLogsBtn = document.getElementById("clearLogsBtn");
      const modalEl = document.getElementById("modal");
      const modalTitle = document.getElementById("modalTitle");
      const modalFields = document.getElementById("modalFields");
      const modalSubmit = document.getElementById("modalSubmit");
      const modalCancel = document.getElementById("modalCancel");

      let currentModal = null;
      let currentMenuActionIds = new Set();
      let isLoading = false;
      let pendingLoad = false;
      let actionInProgress = false;
      let localSelectOpen = false;
      let userSelectQuery = "";
      let userSelectListEl = null;
      let lastUserList = [];

      function setStatus(text) {
        const value = text || "";
        statusEl.textContent = value;
        statusEl.style.display = value ? "block" : "none";
      }

      function buildActionIdSet(components) {
        const set = new Set();
        (components || []).forEach(row => {
          (row || []).forEach(btn => {
            if (btn && btn.customId) set.add(btn.customId);
          });
        });
        return set;
      }

      function renderMenu(state) {
        if (!state || !state.embed) {
          menuEl.style.display = "none";
          currentMenuActionIds = new Set();
          return;
        }
        menuEl.style.display = "block";
        currentMenuActionIds = buildActionIdSet(state.components || []);
        embedTitle.textContent = state.embed.title || "";
        embedDesc.textContent = state.embed.description || "";
        embedFields.innerHTML = "";
        if (Array.isArray(state.embed.fields)) {
          state.embed.fields.forEach(f => {
            const div = document.createElement("div");
            div.className = "field";
            div.innerHTML = `<div class="name">${f.name || ""}</div><div class="value">${f.value || ""}</div>`;
            embedFields.appendChild(div);
          });
        }
        embedRows.innerHTML = "";
        if (Array.isArray(state.components)) {
          state.components.forEach(row => {
            const rowEl = document.createElement("div");
            rowEl.className = "row";
            row.forEach(btn => {
              const b = document.createElement("button");
              b.className = "btn " + (btn.style === 1 ? "primary" : btn.style === 3 ? "success" : btn.style === 4 ? "danger" : "");
              if (btn.disabled || actionInProgress) b.classList.add("disabled");
              b.disabled = !!btn.disabled || actionInProgress;
              const label = (btn.emoji ? btn.emoji + " " : "") + (btn.label || "");
              b.textContent = label.trim() || btn.customId;
              if (btn.type === "select") {
                b.onclick = () => openSelectModal(btn);
              } else {
                b.onclick = () => triggerAction(btn.customId);
              }
              rowEl.appendChild(b);
            });
            embedRows.appendChild(rowEl);
          });
        }
      }

      function renderLogs(logs) {
        if (!Array.isArray(logs) || !logs.length) {
          logPanel.style.display = "none";
          logList.innerHTML = "";
          return;
        }
        logPanel.style.display = "block";
        logList.innerHTML = "";
        logs.slice(-20).reverse().forEach(entry => {
          if (typeof entry === "string") entry = { ts: Date.now(), text: entry };
          const wrap = document.createElement("div");
          wrap.className = "log-entry";

          const meta = document.createElement("div");
          meta.className = "log-meta";
          const d = new Date(entry.ts || Date.now());
          const when = d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
          meta.textContent = when;

          const text = document.createElement("div");
          text.className = "log-text";
          text.textContent = entry.text || "";

          wrap.appendChild(meta);
          wrap.appendChild(text);
          logList.appendChild(wrap);
        });
      }

      function applyState(data) {
        if (!data || data.ok === false) return false;
        if (!data.ready) {
          setStatus("Bot pas prêt.");
          menuEl.style.display = "none";
          return false;
        }
        if (!data.bound) {
          setStatus("Mode local non activé. Clique sur Activer (local).");
          menuEl.style.display = "none";
          renderModal(null);
          return false;
        }
        setStatus("");
        renderMenu(data);
        if (data.modal) {
          localSelectOpen = false;
          renderModal(data.modal);
        } else if (!localSelectOpen) {
          renderModal(null);
        }
        renderLogs(data.logs);
        return true;
      }

      function openSelectModal(btn) {
        const isUser = btn.selectType === "user";
        let placeholder = "";
        if (!isUser && Array.isArray(btn.options) && btn.options.length) {
          placeholder = btn.options.map(opt => `${opt.label}:${opt.value}`).join(" | ").slice(0, 200);
        }
        if (isUser) {
          localSelectOpen = true;
          userSelectQuery = "";
          lastUserList = [];
          currentModal = {
            customId: "ui_select_" + (btn.customId || ""),
            title: btn.label || "Choisir un utilisateur",
            kind: "user_select"
          };
          renderModal(currentModal);
          return;
        }
        currentModal = {
          customId: "ui_select_" + (btn.customId || ""),
          title: btn.label || (isUser ? "Choisir un utilisateur" : "Choisir une option"),
          inputs: [{
            id: "ui_select_value",
            label: isUser ? "ID ou @mention" : "Valeur",
            placeholder: placeholder || (isUser ? "1234567890 ou @pseudo" : ""),
            required: true
          }]
        };
        renderModal(currentModal);
      }

      function renderModal(modal) {
        currentModal = modal || null;
        if (!modal) {
          modalEl.style.display = "none";
          modalTitle.textContent = "";
          modalFields.innerHTML = "";
          return;
        }
        modalEl.style.display = "block";
        modalTitle.textContent = modal.title || "Formulaire";
        modalFields.innerHTML = "";
        modalSubmit.style.display = "inline-flex";
        if (modal.kind === "channel_select") {
          modalSubmit.style.display = "none";
          const list = document.createElement("div");
          list.className = "rows";
          modalFields.appendChild(list);
          (modal.channels || []).forEach(ch => {
            const row = document.createElement("div");
            row.className = "row";
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.textContent = ch.name || ch.id;
            btn.onclick = () => selectChannel(ch.id);
            row.appendChild(btn);
            list.appendChild(row);
          });
          return;
        }
        if (modal.kind === "guild_select") {
          modalSubmit.style.display = "none";
          const list = document.createElement("div");
          list.className = "rows";
          modalFields.appendChild(list);
          (modal.guilds || []).forEach(g => {
            const row = document.createElement("div");
            row.className = "row";
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.textContent = g.name || g.id;
            btn.onclick = () => selectGuild(g.id);
            row.appendChild(btn);
            list.appendChild(row);
          });
          return;
        }
        if (modal.kind === "user_select") {
          modalSubmit.style.display = "none";
          const searchWrap = document.createElement("div");
          searchWrap.className = "field";
          const label = document.createElement("div");
          label.className = "name";
          label.textContent = "Recherche";
          const inp = document.createElement("input");
          inp.className = "input";
          inp.placeholder = "Tape un pseudo...";
          inp.value = userSelectQuery;
          inp.oninput = () => {
            userSelectQuery = inp.value || "";
            refreshUserList();
          };
          searchWrap.appendChild(label);
          searchWrap.appendChild(inp);
          modalFields.appendChild(searchWrap);

          userSelectListEl = document.createElement("div");
          userSelectListEl.className = "rows";
          modalFields.appendChild(userSelectListEl);
          refreshUserList();
          return;
        }
        (modal.inputs || []).forEach(input => {
          const wrap = document.createElement("div");
          wrap.className = "field";
          const label = document.createElement("div");
          label.className = "name";
          label.textContent = input.label || input.id;
          const inp = document.createElement("input");
          inp.className = "input";
          inp.placeholder = input.placeholder || "";
          inp.dataset.inputId = input.id;
          wrap.appendChild(label);
          wrap.appendChild(inp);
          modalFields.appendChild(wrap);
        });
      }

      async function fetchUserList() {
        try {
          const res = await fetch(API + "/ui/users?limit=40&q=" + encodeURIComponent(userSelectQuery || ""));
          const data = await res.json().catch(() => ({}));
          if (!data || data.ok === false) {
            setStatus(data.error || "Liste indisponible.");
            return null;
          }
          return Array.isArray(data.users) ? data.users : [];
        } catch (e) {
          setStatus("Liste indisponible.");
          return null;
        }
      }

      async function refreshUserList() {
        if (!userSelectListEl) return;
        const users = await fetchUserList();
        if (users === null) {
          if (!lastUserList.length) {
            userSelectListEl.innerHTML = "";
            const empty = document.createElement("div");
            empty.className = "log-text";
            empty.textContent = "Impossible de charger la liste.";
            userSelectListEl.appendChild(empty);
          }
          return;
        }
        lastUserList = users;
        userSelectListEl.innerHTML = "";
        if (!users.length) {
          const empty = document.createElement("div");
          empty.className = "log-text";
          empty.textContent = "Aucun utilisateur trouvé.";
          userSelectListEl.appendChild(empty);
          return;
        }
        users.forEach(user => {
          const row = document.createElement("div");
          row.className = "row";
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = user.name || user.id;
          btn.onclick = () => selectUser(user.id);
          row.appendChild(btn);
          userSelectListEl.appendChild(row);
        });
      }

      async function selectUser(userId) {
        if (!currentModal?.customId) return;
        if (actionInProgress) return;
        actionInProgress = true;
        setStatus("Sélection de l'utilisateur...");
        try {
          const res = await fetch(API + "/ui/modal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ customId: currentModal.customId, values: { ui_select_value: userId } })
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Sélection refusée.");
            actionInProgress = false;
            return;
          }
          localSelectOpen = false;
          currentModal = null;
          renderModal(null);
          actionInProgress = false;
          if (!applyState(data.state)) await loadState(true);
        } catch (e) {
          setStatus("Sélection échouée.");
        } finally {
          actionInProgress = false;
        }
      }

      async function fetchGuilds() {
        try {
          const res = await fetch(API + "/ui/guilds");
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Liste des serveurs indisponible.");
            return [];
          }
          return Array.isArray(data.guilds) ? data.guilds : [];
        } catch (e) {
          setStatus("Liste des serveurs indisponible.");
          return [];
        }
      }

      async function fetchChannels() {
        try {
          const res = await fetch(API + "/ui/channels");
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Liste des salons indisponible.");
            return [];
          }
          return Array.isArray(data.channels) ? data.channels : [];
        } catch (e) {
          setStatus("Liste des salons indisponible.");
          return [];
        }
      }

      async function openGuildPicker() {
        const guilds = await fetchGuilds();
        if (!guilds.length) {
          setStatus("Aucun serveur disponible.");
          return;
        }
        currentModal = { customId: "ui_select_guild", title: "Choisir un serveur", kind: "guild_select", guilds };
        renderModal(currentModal);
      }

      async function openChannelPicker() {
        const channels = await fetchChannels();
        if (!channels.length) {
          setStatus("Aucun salon disponible.");
          return;
        }
        currentModal = { customId: "ui_select_channel", title: "Choisir un salon", kind: "channel_select", channels };
        renderModal(currentModal);
      }

      async function selectGuild(guildId) {
        if (!guildId) return;
        setStatus("Sélection du serveur...");
        try {
          const res = await fetch(API + "/ui/select_guild", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ guildId })
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Sélection impossible.");
            return;
          }
          currentModal = null;
          renderModal(null);
          if (!applyState(data.state)) await loadState(true);
        } catch (e) {
          setStatus("Sélection impossible.");
        }
      }

      async function selectChannel(channelId) {
        if (!channelId) return;
        setStatus("Sélection du salon...");
        try {
          const res = await fetch(API + "/ui/select_channel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channelId })
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Sélection impossible.");
            return;
          }
          currentModal = null;
          renderModal(null);
          if (!applyState(data.state)) await loadState(true);
        } catch (e) {
          setStatus("Sélection impossible.");
        }
      }

      async function loadState(force = false, silent = false) {
        if (currentModal && !force) return;
        if (localSelectOpen && !force) return;
        if (actionInProgress && !force) return;
        if (isLoading) { pendingLoad = true; return; }
        isLoading = true;
        if (!silent) setStatus("Chargement...");
        try {
          const res = await fetch(API + "/ui/state");
          const data = await res.json();
          applyState(data);
        } catch (e) {
          if (!silent) setStatus("Impossible de se connecter au bot.");
        } finally {
          isLoading = false;
          if (pendingLoad) {
            pendingLoad = false;
            loadState(false, silent);
          }
        }
      }

      async function bindChannel() {
        setStatus("Connexion...");
        try {
          const res = await fetch(API + "/ui/bind", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ local: true })
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Connexion impossible.");
            return;
          }
          if (!applyState(data.state)) await loadState();
        } catch (e) {
          setStatus("Échec de connexion.");
        }
      }

      async function triggerAction(customId) {
        setStatus("Action: " + customId);
        if (actionInProgress) return;
        actionInProgress = true;
        try {
          const res = await fetch(API + "/ui/action", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ customId })
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Action refusée.");
            actionInProgress = false;
            return;
          }
          actionInProgress = false;
          if (!applyState(data.state)) await loadState(true);
        } catch (e) {
          setStatus("Action échouée.");
        } finally {
          actionInProgress = false;
        }
      }

      async function submitModal() {
        if (!currentModal) return;
        if (actionInProgress) return;
        actionInProgress = true;
        const values = {};
        modalFields.querySelectorAll("input").forEach(inp => {
          values[inp.dataset.inputId] = inp.value || "";
        });
        setStatus("Validation du formulaire...");
        try {
          const res = await fetch(API + "/ui/modal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ customId: currentModal.customId, values })
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Formulaire refusé.");
            actionInProgress = false;
            return;
          }
          currentModal = null;
          actionInProgress = false;
          if (!applyState(data.state)) await loadState(true);
        } catch (e) {
          setStatus("Échec du formulaire.");
        } finally {
          actionInProgress = false;
        }
      }

      function cancelModal() {
        currentModal = null;
        localSelectOpen = false;
        renderModal(null);
      }

      async function clearLogs() {
        setStatus("Nettoyage de l'historique...");
        try {
          const res = await fetch(API + "/ui/clear_logs", { method: "POST" });
          const data = await res.json().catch(() => ({}));
          if (data && data.ok === false) {
            setStatus(data.error || "Nettoyage impossible.");
            return;
          }
          if (!applyState(data.state)) await loadState(true);
        } catch (e) {
          setStatus("Nettoyage impossible.");
        }
      }

      bindBtn.onclick = bindChannel;
      refreshBtn.onclick = () => loadState(true);
      serverBtn.onclick = openGuildPicker;
      channelBtn.onclick = openChannelPicker;
      clearLogsBtn.onclick = clearLogs;
      modalSubmit.onclick = submitModal;
      modalCancel.onclick = cancelModal;
      bindChannel();
    </script>
  </body>
</html>
