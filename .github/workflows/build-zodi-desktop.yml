name: Build Zodi AI desktop launchers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/zodi-ai-desktop/**"
      - ".github/workflows/build-zodi-desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/zodi-ai-desktop/**"
      - ".github/workflows/build-zodi-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            artifact: zodi-ai-windows-installer
          - os: ubuntu-latest
            command: build:linux
            artifact: zodi-ai-linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/zodi-ai-desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: apps/zodi-ai-desktop
        run: npm run ${{ matrix.command }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/zodi-ai-desktop/dist/*
          if-no-files-found: error
          retention-days: 30
