name: ZodiBot CI

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".replit"
      - "discord-bot/**"
      - ".github/workflows/zodibot-ci.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".replit"
      - "discord-bot/**"
      - ".github/workflows/zodibot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install and verify ZodiBot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root project and bot dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm test

      - name: Verify no Electron or dotenv runtime dependencies
        shell: bash
        run: |
          node -e "const p=require('./discord-bot/package.json'); if(p.dependencies?.electron || p.devDependencies?.electron || p.dependencies?.dotenv || p.devDependencies?.dotenv) process.exit(1)"
          test ! -e discord-bot/.env
